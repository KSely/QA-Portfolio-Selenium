name: Selenium CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_portfolio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qa_portfolio"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout application under test
        uses: actions/checkout@v5
        with:
          repository: KSely/QA-Automation-Portfolio
          path: qa-automation-portfolio

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: qa-automation-portfolio/package-lock.json

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Install application dependencies
        working-directory: qa-automation-portfolio
        run: npm ci

      - name: Create application environment
        working-directory: qa-automation-portfolio
        run: |
          cp .env.example .env
          sed -i 's/DB_PASSWORD=your_password/DB_PASSWORD=postgres/' .env

      - name: Create test configuration
        run: |
          cp src/main/resources/config.properties.example src/main/resources/config.properties
          sed -i 's/dbPassword=your_database_password/dbPassword=postgres/' src/main/resources/config.properties
          
      - name: Create database schema
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d qa_portfolio \
            -c "CREATE TABLE IF NOT EXISTS messages (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              email VARCHAR(255) NOT NULL,
              message TEXT NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );"   

      - name: Start application under test
        working-directory: qa-automation-portfolio
        run: |
          npm start > app.log 2>&1 &
          
      - name: Verify application is running
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/api/status; then
              exit 0
            fi
            sleep 2
          done
          cat qa-automation-portfolio/app.log
          exit 1

      - name: Build project
        run: mvn -B clean compile

      - name: Run API tests
        run: mvn -B test -Dsuitexmlfile=src/test/resources/test-suites/api-suite.xml

      - name: Run database tests
        run: mvn -B test -Dsuitexmlfile=src/test/resources/test-suites/database-suite.xml

      - name: Run UI smoke tests
        run: mvn -B test -Dsuitexmlfile=src/test/resources/test-suites/smoke-suite.xml

      - name: Run UI regression tests
        run: mvn -B test -Dsuitexmlfile=src/test/resources/test-suites/regression-suite.xml

      - name: Upload Allure results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

